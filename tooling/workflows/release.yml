name: offline-release
on:
  workflow_dispatch:
jobs:
  build-sign-package:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm airgap:bundle
      - run: echo "Generate SBOM, sign artifacts via operator key custody, then verify offline."
