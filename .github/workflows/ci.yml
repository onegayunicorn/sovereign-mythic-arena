name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Install JavaScript workspaces
        run: pnpm install --frozen-lockfile
      - name: Build frontends
        run: pnpm build
      - name: Check TypeScript
        run: pnpm typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.1.3
      - name: Install API dependencies and test
        run: |
          poetry -C apps/api install
          pnpm test
