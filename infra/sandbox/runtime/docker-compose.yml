services:
  docker:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=tcp://0.0.0.0:2375
      - --tls=false
      - --iptables=false
    volumes:
      - dind-data:/var/lib/docker
    networks: [sandbox]
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 30

  sandboxd:
    image: python:3.12-slim
    depends_on:
      docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://docker:2375
      SANDBOX_ENABLE_DOCKER: "true"
      SANDBOXD_PORT: "2376"
      SANDBOX_STATE_DIR: /var/lib/sandboxd
      SANDBOX_ALLOWED_IMAGES: python:3.12-slim,alpine:3.20
      SANDBOX_MAX_MEMORY_BYTES: "2147483648"
      SANDBOX_MAX_CPUS: "1.0"
    volumes:
      - ../sandboxd.py:/app/sandboxd.py:ro
      - sandbox-state:/var/lib/sandboxd
    working_dir: /app
    command: ["python", "sandboxd.py"]
    ports:
      - "127.0.0.1:2376:2376"
    networks: [sandbox]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  sandbox:
    internal: true

volumes:
  dind-data:
  sandbox-state:
